<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英検準2級 文法・語法トレーニング</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px 16px 40px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .app {
    background: #fff;
    border-radius: 24px;
    width: 100%;
    max-width: 680px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.35);
    overflow: hidden;
  }

  /* ===== ヘッダー ===== */
  .app-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .app-header .hd-title { font-size: 1.05em; font-weight: 800; letter-spacing: 0.3px; }
  .app-header .hd-sub { font-size: 0.8em; opacity: 0.85; margin-top: 2px; }
  .hd-home-link {
    color: #fff; text-decoration: none; font-size: 0.75em; font-weight: 700;
    background: rgba(255,255,255,0.18); border-radius: 50px; padding: 6px 14px;
    white-space: nowrap; flex-shrink: 0; transition: background 0.15s;
  }
  .hd-home-link:hover { background: rgba(255,255,255,0.32); }

  /* ===== ページ管理 ===== */
  .page { display: none; padding: 24px; }
  .page.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  /* ===== ボタン共通 ===== */
  .btn {
    display: inline-block;
    padding: 13px 28px;
    border-radius: 50px;
    border: none;
    font-size: 0.95em;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg,#667eea,#764ba2); color:#fff; }
  .btn-green   { background: linear-gradient(135deg,#43e97b,#38f9d7); color:#fff; }
  .btn-orange  { background: linear-gradient(135deg,#f7971e,#ffd200); color:#fff; }
  .btn-red     { background: linear-gradient(135deg,#ff416c,#ff4b2b); color:#fff; }
  .btn-gray    { background: #f0f0f0; color:#555; }
  .btn-block   { display: block; width: 100%; margin-bottom: 10px; text-align: center; }

  /* ===== タイトルページ ===== */
  #page-title { text-align: center; padding-top: 30px; }
  .title-icon  { font-size: 4.5em; margin-bottom: 10px; }
  .title-main  { font-size: 1.6em; font-weight: 900; color: #5B6CF5; margin-bottom: 6px; }
  .title-sub   { font-size: 0.92em; color: #888; margin-bottom: 24px; }
  .title-tagline {
    display: inline-block;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color: white;
    border-radius: 50px;
    padding: 6px 18px;
    font-size: 0.85em;
    font-weight: 700;
    margin-bottom: 28px;
  }

  .mode-box {
    background: #f8f9ff;
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 20px;
    text-align: left;
  }
  .mode-box h3 { font-size: 0.9em; color: #5B6CF5; font-weight: 800; margin-bottom: 12px; }
  .mode-options { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .mode-opt {
    flex: 1; min-width: 90px;
    background: #fff; border: 2px solid #e2e5f5; border-radius: 12px;
    padding: 12px 8px; text-align: center; cursor: pointer; transition: all 0.15s;
  }
  .mode-opt.selected { border-color: #5B6CF5; background: #eef0ff; }
  .mode-opt .n { font-size: 1.3em; font-weight: 900; color: #333; }
  .mode-opt .l { font-size: 0.75em; color: #888; margin-top: 2px; }

  /* ===== 出題ページ ===== */
  .progress-wrap { margin-bottom: 18px; }
  .progress-info { display:flex; justify-content:space-between; font-size:0.82em; color:#888; margin-bottom:6px; font-weight:700; }
  .progress-bar-bg { background:#eee; border-radius:8px; height:8px; overflow:hidden; }
  .progress-bar-fill { background: linear-gradient(135deg,#667eea,#764ba2); height:100%; border-radius:8px; transition: width 0.3s; }

  .cat-badge {
    display:inline-block; background:#eef0ff; color:#5B6CF5; font-size:0.75em; font-weight:700;
    border-radius:50px; padding:4px 12px; margin-bottom:14px;
  }
  .back-link {
    display: inline-flex; align-items: center; gap: 4px; background: none; border: none;
    color: #888; font-size: 0.82em; font-weight: 700; cursor: pointer; padding: 0;
    margin-bottom: 14px; font-family: inherit;
  }
  .back-link:hover { color: #5B6CF5; }

  .question-card {
    background: #f8f9ff; border-radius: 16px; padding: 24px 20px; margin-bottom: 18px;
  }
  .question-en { font-size: 1.15em; font-weight: 700; color: #222; line-height: 1.6; }
  .question-en .blank { color: #5B6CF5; font-weight: 900; border-bottom: 2px solid #5B6CF5; padding: 0 4px; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    background: #fff; border: 2px solid #e2e5f5; border-radius: 12px;
    padding: 14px 18px; text-align: left; font-size: 1em; font-weight: 700; color:#333;
    cursor: pointer; transition: all 0.15s;
  }
  .choice-btn:hover:not(:disabled) { border-color: #b9c0f0; background: #f8f9ff; }
  .choice-btn.correct { border-color: #43e97b; background: #eafff3; color: #1a9e5a; }
  .choice-btn.wrong { border-color: #ff4b2b; background: #fff0ee; color: #d13a1f; }
  .choice-btn:disabled { cursor: default; }

  .feedback-box {
    margin-top: 16px; padding: 16px 18px; border-radius: 14px; display: none;
  }
  .feedback-box.show { display: block; animation: fadeIn 0.25s ease; }
  .feedback-box.correct { background: #eafff3; border: 2px solid #43e97b; }
  .feedback-box.wrong { background: #fff0ee; border: 2px solid #ff4b2b; }
  .feedback-title { font-weight: 900; font-size: 0.95em; margin-bottom: 6px; }
  .feedback-box.correct .feedback-title { color: #1a9e5a; }
  .feedback-box.wrong .feedback-title { color: #d13a1f; }
  .feedback-answer { font-size: 0.9em; color: #444; margin-bottom: 4px; }
  .feedback-explain { font-size: 0.85em; color: #666; line-height: 1.5; }

  .nav-row { margin-top: 20px; text-align: right; }

  /* ===== 結果ページ ===== */
  #page-result { text-align: center; padding-top: 20px; }
  .score-circle {
    width: 150px; height: 150px; border-radius: 50%;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .score-circle .num { font-size: 2.2em; font-weight: 900; }
  .score-circle .den { font-size: 0.85em; opacity: 0.85; }
  .score-msg { font-size: 1.05em; font-weight: 800; color: #333; margin-bottom: 24px; }

  .review-list { text-align: left; margin-bottom: 20px; }
  .review-item {
    background: #fff0ee; border: 2px solid #ffd6cf; border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .review-item .rq { font-weight: 700; color: #333; margin-bottom: 6px; }
  .review-item .ra { font-size: 0.88em; color: #1a9e5a; font-weight: 700; margin-bottom: 4px; }
  .review-item .rya { font-size: 0.85em; color: #d13a1f; margin-bottom: 4px; }
  .review-item .re { font-size: 0.83em; color: #777; line-height: 1.5; }

  .result-btns { display: flex; flex-direction: column; gap: 10px; }

  @media (max-width: 480px) {
    .mode-opt { min-width: 70px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="app-header">
    <div>
      <div class="hd-title">英検準2級 文法・語法トレーニング</div>
      <div class="hd-sub">1次試験対策｜空所補充形式</div>
    </div>
    <a class="hd-home-link" href="英検準2級対策.html">🏠 メニュー</a>
  </div>

  <!-- ===== タイトルページ ===== -->
  <div id="page-title" class="page active">
    <div class="title-icon">📘</div>
    <div class="title-main">文法・語法クイズ</div>
    <div class="title-sub">英検準2級レベルの文法問題に挑戦しよう</div>
    <div class="title-tagline">全44問｜4択形式</div>

    <div class="mode-box">
      <h3>出題数を選ぼう</h3>
      <div class="mode-options">
        <div class="mode-opt selected" data-count="20"><div class="n">20問</div><div class="l">標準</div></div>
        <div class="mode-opt" data-count="44"><div class="n">全問</div><div class="l">じっくり</div></div>
      </div>
    </div>

    <button class="btn btn-primary btn-block" id="btn-start" style="max-width:280px;margin:0 auto;">スタート！</button>
  </div>

  <!-- ===== 出題ページ ===== -->
  <div id="page-quiz" class="page">
    <button class="back-link" id="btn-back-to-title">← 出題設定に戻る</button>
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="progress-text">問題 1 / 20</span>
        <span id="progress-score">正解 0</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar" style="width:0%"></div></div>
    </div>

    <span class="cat-badge" id="cat-badge">文法</span>

    <div class="question-card">
      <div class="question-en" id="question-en"></div>
    </div>

    <div class="choices" id="choices"></div>

    <div class="feedback-box" id="feedback-box">
      <div class="feedback-title" id="feedback-title"></div>
      <div class="feedback-answer" id="feedback-answer"></div>
      <div class="feedback-explain" id="feedback-explain"></div>
    </div>

    <div class="nav-row">
      <button class="btn btn-primary" id="btn-next" style="display:none;">次の問題へ</button>
    </div>
  </div>

  <!-- ===== 結果ページ ===== -->
  <div id="page-result" class="page">
    <div class="score-circle">
      <div class="num" id="result-score">0</div>
      <div class="den">/ <span id="result-total">20</span> 問正解</div>
    </div>
    <div class="score-msg" id="result-msg"></div>

    <div id="review-wrap">
      <div class="review-list" id="review-list"></div>
    </div>

    <div class="result-btns">
      <button class="btn btn-orange btn-block" id="btn-retry-wrong" style="display:none;">間違えた問題だけもう一度</button>
      <button class="btn btn-green btn-block" id="btn-retry-all">もう一度挑戦する</button>
      <button class="btn btn-gray btn-block" id="btn-back-title">タイトルに戻る</button>
    </div>
  </div>
</div>

<script>
// ===== 問題データ（英検準2級レベルの文法・語法） =====
const QUESTION_BANK = [
  { cat:"仮定法過去", en:"If I ___ you, I would apologize to her.", correct:"were", wrongs:["was","am","be"], explain:"仮定法過去では、主語が何であってもbe動詞はwereを使うのが基本です。" },
  { cat:"仮定法過去", en:"If she had more time, she ___ join the club.", correct:"would", wrongs:["will","does","is"], explain:"仮定法過去の帰結節は〈would/could/might+動詞の原形〉です。" },
  { cat:"仮定法過去完了", en:"If I had studied harder, I ___ passed the exam.", correct:"would have", wrongs:["would","will have","had"], explain:"仮定法過去完了は〈If+主語+had+過去分詞, 主語+would have+過去分詞〉の形です。" },
  { cat:"分詞構文", en:"___ tired, she went to bed early.", correct:"Being", wrongs:["Be","Been","To be"], explain:"分詞構文は動詞をing形にします。Being tiredは「疲れていたので」という意味です。" },
  { cat:"分詞構文", en:"___ by many people, this festival has a long history.", correct:"Loved", wrongs:["Loving","Love","To love"], explain:"「愛されている」という受け身の意味の分詞構文は過去分詞を使います。" },
  { cat:"関係副詞", en:"This is the town ___ I was born.", correct:"where", wrongs:["which","when","that"], explain:"場所を表す先行詞（town）には関係副詞whereを使います。" },
  { cat:"関係副詞", en:"I remember the day ___ we first met.", correct:"when", wrongs:["where","which","who"], explain:"時を表す先行詞（the day）には関係副詞whenを使います。" },
  { cat:"関係副詞", en:"Tell me the reason ___ you were late.", correct:"why", wrongs:["how","where","which"], explain:"理由を表す先行詞（the reason）には関係副詞whyを使います。" },
  { cat:"現在完了進行形", en:"I ___ studying English for three hours.", correct:"have been", wrongs:["have","am","was"], explain:"動作が今も続いていることを強調する現在完了進行形は〈have been+動詞のing形〉です。" },
  { cat:"過去完了", en:"When I arrived, the train ___ already left.", correct:"had", wrongs:["has","was","have"], explain:"過去のある時点よりさらに前のことは過去完了〈had+過去分詞〉で表します。" },
  { cat:"使役・知覚", en:"I had my bag ___ by someone at the station.", correct:"stolen", wrongs:["steal","stealing","to steal"], explain:"have+目的語+過去分詞で「〜される（被害）」という意味を表します。" },
  { cat:"使役・知覚", en:"She got her brother ___ the door.", correct:"to open", wrongs:["open","opening","opened"], explain:"get+人+to doで「（人）に〜させる、してもらう」という意味になります。" },
  { cat:"話法", en:"He said that he ___ tired.", correct:"was", wrongs:["is","be","been"], explain:"間接話法では時制の一致が起こり、isはwasに変わります。" },
  { cat:"比較", en:"This bridge is twice ___ long as that one.", correct:"as", wrongs:["so","than","more"], explain:"「〜の2倍…」は〈twice as+原級+as〉で表します。" },
  { cat:"比較", en:"He is not so much a teacher ___ a friend to us.", correct:"as", wrongs:["than","that","so"], explain:"not so much A as B「AというよりむしろB」という表現です。" },
  { cat:"比較", en:"The more you practice, ___ you will become.", correct:"the better", wrongs:["better","the best","best"], explain:"〈The+比較級 ~, the+比較級 …〉で「〜すればするほど…」という意味になります。" },
  { cat:"強調構文", en:"It was Ken ___ broke the window.", correct:"who", wrongs:["which","what","whom"], explain:"It is/was ~ that(who) …の強調構文で、人を強調する場合はwhoも使えます。" },
  { cat:"不定詞構文", en:"This question is too difficult ___ solve.", correct:"to", wrongs:["for","that","so"], explain:"too ~ to …で「…するには〜すぎる」という意味です。" },
  { cat:"接続詞構文", en:"She was so tired ___ she couldn't walk anymore.", correct:"that", wrongs:["as","so","to"], explain:"so ~ that …で「とても〜なので…」という意味を表します。" },
  { cat:"不定詞構文", en:"He is old enough ___ drive a car.", correct:"to", wrongs:["for","that","of"], explain:"〈形容詞+enough to〉で「〜するのに十分…」という意味になります。" },
  { cat:"付帯状況", en:"He was standing there ___ his arms folded.", correct:"with", wrongs:["by","at","in"], explain:"付帯状況を表すwithは「〜した状態で」という意味です。" },
  { cat:"部分否定", en:"I don't always ___ breakfast.", correct:"eat", wrongs:["eats","ate","eating"], explain:"not always「いつも〜とは限らない」という部分否定。don'tの後ろの動詞は原形です。" },
  { cat:"助動詞+完了形", en:"He is not here. He ___ have forgotten our appointment.", correct:"must", wrongs:["can","should","need"], explain:"must have+過去分詞で「〜したに違いない」という強い推量を表します。" },
  { cat:"助動詞+完了形", en:"You ___ have told me earlier. I didn't know at all.", correct:"should", wrongs:["must","can","would"], explain:"should have+過去分詞で「〜すべきだったのに（しなかった）」という後悔を表します。" },
  { cat:"熟語", en:"He worked hard to make up ___ lost time.", correct:"for", wrongs:["to","with","of"], explain:"make up for 〜で「〜を埋め合わせる」という意味の熟語です。" },
  { cat:"熟語", en:"You should take advantage ___ this good opportunity.", correct:"of", wrongs:["for","at","with"], explain:"take advantage of 〜で「〜を利用する」という意味の熟語です。" },
  { cat:"熟語", en:"___ the rain, they went out to play soccer.", correct:"In spite of", wrongs:["Despite of","Even if","Although"], explain:"in spite of+名詞で「〜にもかかわらず」という意味です。despite ofという形はありません。" },
  { cat:"熟語", en:"She is capable ___ solving the difficult problem.", correct:"of", wrongs:["to","for","with"], explain:"be capable of 〜ingで「〜する能力がある」という意味です。" },
  { cat:"動名詞", en:"He gave up ___ smoking last year.", correct:"smoking", wrongs:["smoke","to smoke","smoked"], explain:"give upは動名詞（-ing形）のみを目的語にとる動詞です。" },
  { cat:"不定詞", en:"She decided ___ abroad to study nursing.", correct:"to go", wrongs:["going","go","went"], explain:"decideは不定詞（to+動詞の原形）のみを目的語にとる動詞です。" },
  { cat:"感情形容詞", en:"The movie was so ___ that everyone in the theater cried.", correct:"moving", wrongs:["moved","move","to move"], explain:"「（人を）感動させるような」という意味では、物事が主語のとき-ing形を使います。" },
  { cat:"感情形容詞", en:"I was ___ to hear the surprising news.", correct:"surprised", wrongs:["surprising","surprise","surprises"], explain:"人が主語で「〜させられた（驚かされた）」という受け身的な意味は-ed形を使います。" },
  { cat:"前置詞+関係代名詞", en:"This is the house ___ which I used to live.", correct:"in", wrongs:["at","on","to"], explain:"live in a houseという関係から、前置詞inを使います。" },
  { cat:"譲歩", en:"Child ___ she was, she behaved very bravely.", correct:"as", wrongs:["though","that","so"], explain:"〈名詞/形容詞+as+主語+動詞〉で「〜だけれども」という譲歩を表します。" },
  { cat:"疑問詞+to不定詞", en:"I don't know ___ to solve this difficult problem.", correct:"how", wrongs:["what","which","that"], explain:"how to 〜で「〜する方法」という意味になります。" },
  { cat:"不定詞の意味上の主語", en:"It is important ___ us to protect the environment.", correct:"for", wrongs:["of","to","with"], explain:"It is 形容詞 for 人 to 〜「（人）が〜することは…だ」の形です。" },
  { cat:"不定詞の意味上の主語", en:"It was very kind ___ you to help me with my homework.", correct:"of", wrongs:["for","to","with"], explain:"kindのように人の性質を表す形容詞のときは、意味上の主語にofを使います。" },
  { cat:"使役動詞の受動態", en:"I was made ___ wait for an hour at the hospital.", correct:"to wait", wrongs:["wait","waiting","waited"], explain:"使役動詞makeを受動態にすると、後ろの動詞の原形にtoがつきます。" },
  { cat:"接続詞", en:"___ he is young, he is very wise and mature.", correct:"Although", wrongs:["Despite","Because","So"], explain:"althoughは接続詞で後ろに〈主語+動詞〉が続きます。despiteは前置詞なので名詞が続きます。" },
  { cat:"関係代名詞what", en:"___ he said at the meeting surprised everyone.", correct:"What", wrongs:["That","Which","Who"], explain:"「〜すること、もの」という意味を持つ関係代名詞whatを使います。" },
  { cat:"副詞", en:"Have you finished your homework ___?", correct:"yet", wrongs:["already","just","still"], explain:"疑問文で「もう〜しましたか」とたずねるときはyetを使います。" },
  { cat:"譲歩", en:"___ how hard it is, I will never give up.", correct:"No matter", wrongs:["However","Whatever","Even"], explain:"no matter how ~で「どんなに〜でも」という譲歩を表します。" },
  { cat:"熟語", en:"The accident resulted ___ his death.", correct:"in", wrongs:["from","to","with"], explain:"result in 〜で「〜という結果になる」という意味です。" },
  { cat:"熟語", en:"His great success resulted ___ years of hard work.", correct:"from", wrongs:["in","to","with"], explain:"result from 〜で「〜から生じる」という意味です。resultの前後でin/fromの向きが逆になる点に注意しましょう。" },
];

// ===== 状態管理 =====
let selectedCount = 20;
let quizQueue = [];    // 今回出題する問題の配列
let currentIndex = 0;
let correctCount = 0;
let wrongQuestions = []; // 間違えた問題を記録（復習用）
let answered = false;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function goPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== タイトルページ：出題数選択 =====
document.querySelectorAll('.mode-opt').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('.mode-opt').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    selectedCount = parseInt(opt.dataset.count, 10);
  });
});

document.getElementById('btn-start').addEventListener('click', () => {
  startQuiz(shuffle(QUESTION_BANK).slice(0, selectedCount));
});

document.getElementById('btn-back-to-title').addEventListener('click', () => {
  goPage('page-title');
});

function startQuiz(questions) {
  quizQueue = questions;
  currentIndex = 0;
  correctCount = 0;
  wrongQuestions = [];
  goPage('page-quiz');
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = quizQueue[currentIndex];
  document.getElementById('progress-text').textContent = `問題 ${currentIndex + 1} / ${quizQueue.length}`;
  document.getElementById('progress-score').textContent = `正解 ${correctCount}`;
  document.getElementById('progress-bar').style.width = `${(currentIndex / quizQueue.length) * 100}%`;
  document.getElementById('cat-badge').textContent = q.cat;
  document.getElementById('question-en').innerHTML = q.en.replace('___', '<span class="blank">___</span>');

  const options = shuffle([q.correct, ...q.wrongs]);
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(btn, opt, q));
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback-box').classList.remove('show', 'correct', 'wrong');
  document.getElementById('btn-next').style.display = 'none';
}

function selectAnswer(btn, opt, q) {
  if (answered) return;
  answered = true;
  const isCorrect = opt === q.correct;

  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === q.correct) b.classList.add('correct');
    else if (b === btn) b.classList.add('wrong');
  });

  const fb = document.getElementById('feedback-box');
  fb.classList.add('show', isCorrect ? 'correct' : 'wrong');
  document.getElementById('feedback-title').textContent = isCorrect ? '⭕ 正解！' : '❌ 不正解';
  document.getElementById('feedback-answer').textContent = `正解: ${q.correct}`;
  document.getElementById('feedback-explain').textContent = q.explain;

  if (isCorrect) {
    correctCount++;
  } else {
    wrongQuestions.push(q);
  }
  document.getElementById('progress-score').textContent = `正解 ${correctCount}`;
  document.getElementById('btn-next').style.display = 'inline-block';
}

document.getElementById('btn-next').addEventListener('click', () => {
  currentIndex++;
  if (currentIndex < quizQueue.length) {
    showQuestion();
  } else {
    showResult();
  }
});

function showResult() {
  document.getElementById('progress-bar').style.width = '100%';
  goPage('page-result');
  document.getElementById('result-score').textContent = correctCount;
  document.getElementById('result-total').textContent = quizQueue.length;

  const rate = correctCount / quizQueue.length;
  let msg = '';
  if (rate === 1) msg = '🎉 パーフェクト！すばらしい！';
  else if (rate >= 0.8) msg = '😊 よくできました！この調子！';
  else if (rate >= 0.6) msg = '👍 もう少し！復習して再挑戦しよう';
  else msg = '💪 間違えた問題を復習しよう';
  document.getElementById('result-msg').textContent = msg;

  const reviewList = document.getElementById('review-list');
  reviewList.innerHTML = '';
  if (wrongQuestions.length > 0) {
    const heading = document.createElement('h3');
    heading.style.cssText = 'font-size:0.9em;color:#d13a1f;font-weight:800;margin-bottom:10px;';
    heading.textContent = `間違えた問題（${wrongQuestions.length}問）の復習`;
    reviewList.appendChild(heading);

    wrongQuestions.forEach(q => {
      const div = document.createElement('div');
      div.className = 'review-item';
      div.innerHTML = `
        <div class="rq">${q.en.replace('___', '＿＿＿')}</div>
        <div class="ra">正解: ${q.correct}</div>
        <div class="re">${q.explain}</div>
      `;
      reviewList.appendChild(div);
    });
    document.getElementById('btn-retry-wrong').style.display = 'block';
  } else {
    document.getElementById('btn-retry-wrong').style.display = 'none';
  }
}

document.getElementById('btn-retry-wrong').addEventListener('click', () => {
  startQuiz(shuffle(wrongQuestions));
});

document.getElementById('btn-retry-all').addEventListener('click', () => {
  startQuiz(shuffle(QUESTION_BANK).slice(0, selectedCount));
});

document.getElementById('btn-back-title').addEventListener('click', () => {
  goPage('page-title');
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英語学習アプリ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px 16px 40px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .app {
    background: #fff;
    border-radius: 24px;
    width: 100%;
    max-width: 680px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.35);
    overflow: hidden;
  }

  .app-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 16px 24px;
  }
  .app-header .hd-title { font-size: 1.05em; font-weight: 800; letter-spacing: 0.3px; }
  .app-header .hd-sub { font-size: 0.8em; opacity: 0.85; margin-top: 2px; }

  .page { padding: 24px 24px 32px; text-align: center; }
  .title-icon { font-size: 4.5em; margin-bottom: 10px; }
  .title-main { font-size: 1.7em; font-weight: 900; color: #5B6CF5; margin-bottom: 6px; }
  .title-sub  { font-size: 0.92em; color: #888; margin-bottom: 30px; }

  .category-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .category-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    background: #f8f9ff;
    border: 2px solid #e2e5f5;
    border-radius: 20px;
    padding: 28px 16px;
    text-decoration: none;
    transition: all 0.15s;
  }
  .category-card:hover { border-color: #5B6CF5; transform: translateY(-3px); box-shadow: 0 10px 24px rgba(91,108,245,0.18); }
  .category-card .cc-icon {
    width: 76px; height: 76px; border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 2.4em;
    margin-bottom: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  }
  .category-card .cc-title { font-size: 1.1em; font-weight: 900; color: #333; margin-bottom: 6px; }
  .category-card .cc-desc { font-size: 0.78em; color: #999; line-height: 1.5; }

  .category-card.vocab .cc-icon { background: linear-gradient(135deg,#43e97b,#38f9d7); }
  .category-card.eiken .cc-icon { background: linear-gradient(135deg,#f7971e,#ffd200); }

  @media (max-width: 420px) {
    .category-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="app-header">
    <div class="hd-title">英語学習アプリ</div>
    <div class="hd-sub">English Learning App</div>
  </div>

  <div class="page">
    <div class="title-icon">🎓</div>
    <div class="title-main">英語学習アプリ</div>
    <div class="title-sub">使いたいアプリを選んでください。どちらもブラウザだけで動きます。</div>

    <div class="category-grid">
      <a class="category-card vocab" href="単語学習.html">
        <div class="cc-icon">📚</div>
        <div class="cc-title">単語学習</div>
        <div class="cc-desc">学年ごとの英単語トレーニング</div>
      </a>

      <a class="category-card eiken" href="英検対策.html">
        <div class="cc-icon">🎯</div>
        <div class="cc-title">英検対策</div>
        <div class="cc-desc">級ごとの1次・2次試験対策</div>
      </a>
    </div>
  </div>
</div>

</body>
</html>

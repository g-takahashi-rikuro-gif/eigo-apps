<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文法学習 3年</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px 16px 40px;
    display: flex; justify-content: center; align-items: flex-start;
  }
  .app {
    background: #fff; border-radius: 24px; width: 100%; max-width: 680px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.35); overflow: hidden;
  }
  .app-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white; padding: 16px 24px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  .app-header .hd-title { font-size: 1.05em; font-weight: 800; letter-spacing: 0.3px; }
  .app-header .hd-sub { font-size: 0.8em; opacity: 0.85; margin-top: 2px; }
  .hd-home-link {
    color: #fff; text-decoration: none; font-size: 0.75em; font-weight: 700;
    background: rgba(255,255,255,0.18); border-radius: 50px; padding: 6px 14px;
    white-space: nowrap; flex-shrink: 0;
  }
  .hd-home-link:hover { background: rgba(255,255,255,0.32); }

  .page { display: none; padding: 24px; }
  .page.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  /* ===== ボタン ===== */
  .btn {
    display: inline-block; padding: 13px 28px; border-radius: 50px; border: none;
    font-size: 0.95em; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg,#667eea,#764ba2); color:#fff; }
  .btn-green   { background: linear-gradient(135deg,#43e97b,#38f9d7); color:#fff; }
  .btn-orange  { background: linear-gradient(135deg,#f7971e,#ffd200); color:#fff; }
  .btn-gray    { background: #f0f0f0; color:#555; }
  .btn-block   { display:block; width:100%; margin-bottom:10px; text-align:center; }

  /* ===== 項目えらび ===== */
  .page-title  { font-size:1.2em; font-weight:800; color:#333; margin-bottom:6px; }
  .page-sub    { font-size:0.88em; color:#888; margin-bottom:20px; }
  .item-list   { display:flex; flex-direction:column; gap:12px; }
  .item-card {
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    border:2.5px solid #e8e8e8; border-radius:16px; padding:14px 16px;
    cursor:pointer; transition:all 0.18s; background:#fff; font-family:inherit;
  }
  .item-card:hover { border-color:#5B6CF5; background:#f8f9ff; transform:translateY(-2px); box-shadow:0 6px 20px rgba(91,108,245,0.15); }
  .item-card .ic-icon { font-size:1.9em; flex-shrink:0; width:50px; text-align:center; }
  .item-card .ic-body { flex:1; min-width:0; }
  .item-card .ic-title { font-weight:800; color:#333; font-size:1em; }
  .item-card .ic-sub   { font-size:0.78em; color:#888; margin-top:2px; }
  .item-card .ic-bar-bg { background:#eee; border-radius:10px; height:6px; margin-top:8px; overflow:hidden; }
  .item-card .ic-bar    { background:linear-gradient(90deg,#667eea,#764ba2); height:100%; border-radius:10px; }
  .item-card .ic-pt { flex-shrink:0; text-align:right; white-space:nowrap; }
  .item-card .ic-pt-num { font-size:0.95em; font-weight:800; color:#5B6CF5; }
  .item-card .ic-pt-sub { font-size:0.72em; color:#aaa; margin-top:2px; }

  /* ===== 文法の説明 ===== */
  .grammar-section { background:#f8f9ff; border-radius:16px; padding:18px 20px; margin-bottom:16px; }
  .grammar-section h3 { font-size:1em; font-weight:800; color:#5B6CF5; margin-bottom:12px; }
  .g-lead { font-size:0.9em; color:#555; line-height:1.9; margin-bottom:12px; }
  .formula-box {
    background:#5B6CF5; color:#fff; border-radius:12px; padding:13px 18px;
    font-size:0.98em; font-weight:700; text-align:center; margin-bottom:12px; line-height:1.8;
  }
  .formula-box span { opacity:0.75; font-weight:400; font-size:0.85em; }
  .example-row { background:#fff; border-left:4px solid #43e97b; border-radius:8px; padding:10px 14px; margin-bottom:8px; }
  .example-row.bad { border-left-color:#ff416c; }
  .example-row .en { font-weight:700; color:#333; font-size:0.95em; }
  .example-row .en em { color:#5B6CF5; font-style:normal; }
  .example-row .en .x { color:#ff416c; }
  .example-row .ja { color:#777; font-size:0.83em; margin-top:3px; }
  .kw-table { width:100%; border-collapse:collapse; font-size:0.88em; margin-top:8px; }
  .kw-table th { background:#5B6CF5; color:#fff; padding:7px 12px; text-align:left; }
  .kw-table td { padding:7px 12px; border-bottom:1px solid #eee; background:#fff; }
  .kw-table tr:last-child td { border-bottom:none; }
  .kw { background:#fff3cd; border-radius:4px; padding:2px 7px; font-weight:700; color:#856404; }
  .notice { background:#fff9c4; border:1px solid #ffe082; border-radius:10px; padding:10px 14px; font-size:0.85em; color:#6d4c00; margin-top:12px; line-height:1.7; }
  .notice strong { color:#5B6CF5; }

  /* ===== 練習メニュー ===== */
  .menu-list  { display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
  .menu-card {
    display:flex; align-items:center; gap:14px;
    border:2.5px solid #e8e8e8; border-radius:16px; padding:14px 16px;
    cursor:pointer; transition:all 0.18s; background:#fff; text-align:left; width:100%;
  }
  .menu-card:hover { border-color:#5B6CF5; background:#f8f9ff; transform:translateY(-2px); box-shadow:0 6px 20px rgba(91,108,245,0.15); }
  .menu-card .mc-icon { font-size:1.9em; flex-shrink:0; width:50px; text-align:center; }
  .menu-card .mc-body { flex:1; }
  .menu-card .mc-title { font-weight:800; color:#333; font-size:0.97em; }
  .menu-card .mc-desc  { font-size:0.78em; color:#888; margin-top:2px; }
  .menu-card .mc-pt {
    flex-shrink:0; font-size:0.72em; font-weight:800; color:#5B6CF5;
    background:#eef0ff; border-radius:50px; padding:3px 10px; white-space:nowrap;
  }
  .mc-achievement {
    display:inline-block; margin-top:6px; padding:2px 11px; border-radius:20px;
    font-size:0.76em; font-weight:800; background:#f0f0f0; color:#bbb;
  }
  .mc-achievement.low    { background:#fff0f3; color:#e05; }
  .mc-achievement.mid    { background:#fff9c4; color:#856404; }
  .mc-achievement.high   { background:#e8fff5; color:#1a7a45; }
  .mc-achievement.perfect{ background:linear-gradient(135deg,#43e97b,#38f9d7); color:#fff; }
  .mc-weak {
    display:inline-block; margin-top:6px; margin-left:6px; padding:3px 12px;
    border:none; border-radius:20px; cursor:pointer;
    font-size:0.76em; font-weight:800; font-family:inherit;
    background:linear-gradient(135deg,#f7971e,#ffd200); color:#fff;
  }
  .mc-weak:hover { filter:brightness(1.07); }

  /* ===== 進み具合 ===== */
  .progress-area { margin-bottom:18px; }
  .progress-info { display:flex; justify-content:space-between; font-size:0.8em; color:#888; margin-bottom:6px; }
  .progress-bar-bg { background:#e8e8e8; border-radius:10px; height:7px; overflow:hidden; }
  .progress-bar-fill { background:linear-gradient(90deg,#667eea,#764ba2); height:100%; border-radius:10px; transition:width 0.4s ease; }

  /* ===== 問題画面 ===== */
  .quiz-header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .back-btn { background:none; border:none; font-size:1.4em; cursor:pointer; color:#bbb; padding:2px; line-height:1; }
  .back-btn:hover { color:#5B6CF5; }
  .quiz-header-title { font-size:1em; font-weight:800; color:#333; }
  .quiz-type-badge { margin-left:auto; background:#f0f2ff; color:#5B6CF5; font-size:0.75em; font-weight:700; padding:4px 10px; border-radius:20px; }

  .q-card { background:#f8f9ff; border-radius:16px; padding:18px 20px; margin-bottom:16px; }
  .q-label { font-size:0.75em; font-weight:700; color:#5B6CF5; letter-spacing:1px; margin-bottom:6px; }
  .q-text  { font-size:1.05em; font-weight:700; color:#333; line-height:1.8; }
  .q-ja    { font-size:0.85em; color:#888; margin-top:6px; }
  .q-sub   { font-size:0.84em; color:#666; margin-top:8px; line-height:1.7; }
  .q-blank { color:#5B6CF5; font-weight:900; }

  /* 並べ替え */
  .sort-area-label { font-size:0.78em; color:#888; margin-bottom:5px; }
  .answer-area { display:flex; flex-wrap:wrap; gap:7px; padding:14px; background:#fff9e6; border-radius:12px; border:2px dashed #ffc107; min-height:54px; margin-bottom:10px; }
  .word-bank   { display:flex; flex-wrap:wrap; gap:7px; padding:14px; background:#fff; border-radius:12px; border:2px dashed #ddd; min-height:54px; margin-bottom:14px; }
  .word-chip {
    background:#5B6CF5; color:#fff; border:none; border-radius:20px; padding:7px 14px;
    font-size:0.9em; font-weight:700; cursor:pointer; transition:all 0.12s; user-select:none; font-family:inherit;
  }
  .word-chip:hover:not(:disabled) { background:#4a5bd4; transform:scale(1.05); }
  .word-chip.in-answer { background:#f7971e; }
  .word-chip:disabled { cursor:not-allowed; }

  /* まちがいさがしは、文をそのまま読ませる */
  .find-sentence {
    background:#fff; border:2px dashed #ddd; border-radius:12px;
    padding:18px 20px; margin-bottom:14px;
    font-size:1.2em; font-weight:700; color:#333; line-height:2.2;
  }
  .find-word {
    display:inline; border:none; background:none; padding:3px 4px;
    font:inherit; color:inherit; cursor:pointer;
    border-radius:6px; border-bottom:2px dotted #c9cffa;
  }
  .find-word:hover:not(:disabled) { background:#eef0ff; border-bottom-color:#5B6CF5; }
  .find-word:disabled { cursor:default; }
  .find-word.is-answer { background:#d9f8e8; color:#1a7a45; border-bottom:2px solid #43e97b; }
  .find-word.is-bad    { background:#ffe3e9; color:#c0392b; border-bottom:2px solid #ff416c; }

  /* 選択 */
  .choice-list { display:grid; gap:9px; margin-bottom:14px; }
  .choice-btn {
    display:block; width:100%; padding:13px 16px; background:#fff; border:2px solid #ddd;
    border-radius:12px; text-align:left; font-size:0.95em; font-weight:600; cursor:pointer;
    transition:all 0.12s; color:#333; font-family:inherit;
  }
  .choice-btn:hover:not(:disabled) { border-color:#5B6CF5; background:#f0f2ff; }
  .choice-btn.correct { border-color:#43e97b!important; background:#e8fff5!important; color:#1a7a45!important; }
  .choice-btn.wrong   { border-color:#ff416c!important; background:#fff0f3!important; color:#c0392b!important; }
  .choice-mark { float:right; font-size:1.1em; }

  /* 入力 */
  .ans-input {
    width:100%; padding:13px 15px; border:2px solid #ddd; border-radius:12px;
    font-size:1em; font-family:inherit; margin-bottom:12px;
  }
  .ans-input:focus { outline:none; border-color:#5B6CF5; }
  .blank-input {
    border:none; border-bottom:2.5px solid #5B6CF5; background:#f8f9ff;
    font-size:1em; font-family:inherit; font-weight:700; color:#5B6CF5;
    width:110px; text-align:center; padding:3px 4px; margin:0 3px;
  }
  .blank-input:focus { outline:none; background:#eef0ff; }
  .tmpl-line { font-size:1.05em; font-weight:700; color:#333; line-height:2.4; margin-bottom:14px; }

  /* フィードバック */
  .feedback { border-radius:12px; padding:12px 16px; margin-bottom:14px; font-weight:700; font-size:0.92em; line-height:1.6; display:none; }
  .feedback.correct { background:#e8fff5; color:#1a7a45; border-left:4px solid #43e97b; display:block; }
  .feedback.wrong   { background:#fff0f3; color:#c0392b; border-left:4px solid #ff416c; display:block; }
  .feedback .fb-ans { display:block; margin-top:6px; color:#333; font-weight:800; }
  .feedback .fb-why { display:block; margin-top:6px; color:#555; font-weight:400; font-size:0.95em; }

  .hint-box { background:#fffbee; border:1.5px dashed #ffc107; border-radius:12px; padding:11px 14px; font-size:0.87em; color:#6d4c00; margin-bottom:12px; display:none; }
  .hint-box.visible { display:block; }

  .btn-row { display:flex; gap:10px; align-items:center; }
  .btn-row .spacer { flex:1; }

  /* 結果 */
  #page-result { text-align:center; padding-top:30px; }
  .result-icon { font-size:4.5em; margin-bottom:10px; }
  .result-main { font-size:1.5em; font-weight:900; color:#5B6CF5; margin-bottom:6px; }
  .result-score { font-size:0.95em; color:#888; margin-bottom:8px; }
  .result-pt {
    display:inline-block; background:linear-gradient(135deg,#43e97b,#38f9d7); color:#fff;
    border-radius:50px; padding:8px 22px; font-size:1.05em; font-weight:800; margin-bottom:24px;
  }

  @media (max-width: 480px) {
    .menu-card .mc-icon, .item-card .ic-icon { font-size:1.6em; width:38px; }
    .blank-input { width:90px; }
  }
</style>
</head>

<div class="app">
  <div class="app-header">
    <div>
      <div class="hd-title" id="hd-title">📘 文法学習</div>

  <!-- ===== 項目えらび ===== -->
  <div id="page-items" class="page active">

    <div class="notice" id="storage-warn" style="display:none; margin:0 0 16px;">

  <!-- ===== 練習メニュー ===== -->
  <div id="page-menu" class="page">

  <!-- ===== 問題 ===== -->
  <div id="page-quiz" class="page">

<script>
/**
 * 文法学習の問題データ（中学3年）
 *
 * 文法_3年.html から読み込む。アプリ本体には手を入れずに、
 * ここに項目を足していけば練習が増える。
 *
 * ===== 1つの文につける情報 =====
 *   en      … 正しい英文（語順ならべかえ・日本語⇒英語で使う）
 *   ja      … 日本語訳
 *   accept  … 日本語⇒英語で、ほかにも正解としてよい言い方
 *   choice  … ①形をえらぶ　{ text（(　)が空所）, options, answer, why }
 *   find    … ③まちがいさがし { wrong, bad（まちがった語）, correct, why }
 *   change  … ④文をかえる   { task, from, tmpl（___が空所）, answers, why }
 *
 * ②語順ならべかえ と ⑤日本語⇒英語 は en と ja から自動で作る。
 */
const G3_GRAMMAR = [

// ================================================================
//  1. 現在完了（経験）
// ================================================================
{
  id: 'g3_keiken',
  icon: '🗺️',
  title: '現在完了（経験）',
  sub: 'have / has ＋ 過去分詞 ― 「〜したことがある」',
  intro: `
    <div class="grammar-section">
      <h3>🗺️ 「〜したことがある」の言い方</h3>
      <p class="g-lead">いままでの経験を言うときは <b>have ＋ 過去分詞</b> を使います。
      主語が he / she / my brother などのときは <b>has</b> になります。</p>
      <div class="formula-box">主語 ＋ have / has ＋ 過去分詞 <span>〜したことがある</span></div>
      <div class="example-row">
        <div class="en">I <em>have watched</em> the game many times.</div>
        <div class="ja">私はその試合を何度も見たことがあります。</div>
      </div>
      <div class="example-row">
        <div class="en">Eddy <em>has</em> never <em>watched</em> a sumo match.</div>
        <div class="ja">エディは相撲の試合を一度も見たことがありません。</div>
      </div>
    </div>
    <div class="grammar-section">
      <h3>📌 いっしょによく使うことば</h3>
      <table class="kw-table">
        <tr><th>ことば</th><th>意味</th><th>置く場所</th></tr>
        <tr><td><span class="kw">ever</span></td><td>今までに</td><td>疑問文で have のうしろ</td></tr>
        <tr><td><span class="kw">never</span></td><td>一度も〜ない</td><td>have と過去分詞の間</td></tr>
        <tr><td><span class="kw">once / twice</span></td><td>1回／2回</td><td>文の終わり</td></tr>
        <tr><td><span class="kw">many times</span></td><td>何度も</td><td>文の終わり</td></tr>
        <tr><td><span class="kw">before</span></td><td>以前に</td><td>文の終わり</td></tr>
      </table>
    </div>
    <div class="grammar-section">
      <h3>⚠️ 気をつけること</h3>
      <div class="example-row bad">
        <div class="en">✗ I have visited the museum <b class="x">yesterday</b>.</div>
        <div class="ja">yesterday や last week など<b>過去の一時点</b>とはいっしょに使えません。</div>
      </div>

             why:'I wish のあとは過去形。be 動詞は were。' },
      change:{ task:'「〜がいたらいいのに」という文に', from:'My father is not here.',
               tmpl:'I wish my father ___ ___.', answers:['were','here'],
               why:'is → were にして I wish のあとに置く。' } },

    { en:'If I knew her address, I would write to her.', ja:'彼女の住所を知っていたら、手紙を書くのに。', accept:[],
      choice:{ text:'If I (　) her address, I would write to her.', options:['knew','know','known','knows'], answer:0,
               why:'If の文は過去形。know → knew。' },
      find:{ wrong:'If I know her address, I would write to her.', bad:'know', correct:'knew',
             why:'仮定法の If の文は過去形 knew。' },
      change:{ task:'「もし〜だったら」の文に', from:"I don't know her address.",
               tmpl:'If I ___ her address, I ___ write to her.', answers:['knew','would'],
               why:'know → knew、うしろは would。' } },

    { en:'I wish I had more time.', ja:'もっと時間があったらいいのに。', accept:[],
      choice:{ text:'I wish I (　) more time.', options:['had','have','has','having'], answer:0,
               why:'I wish のあとは過去形 had。' },
      find:{ wrong:'I wish I has more time.', bad:'has', correct:'had',
             why:'I wish のあとは過去形。主語が I でも had。' },
      change:{ task:'「もっと〜があったらいいのに」という文に', from:"I don't have much time.",
               tmpl:'I wish I ___ ___ time.', answers:['had','more'],
               why:'have → had。「もっと」は more。' } },

    { en:'If it were sunny, we would play soccer.', ja:'晴れていたら、サッカーをするのに。', accept:['If it was sunny, we would play soccer.'],
      choice:{ text:'If it (　) sunny, we would play soccer.', options:['were','is','was','be'], answer:0,
               why:'仮定法では主語が it でも were を使うのがふつう。' },
      find:{ wrong:'If it is sunny, we would play soccer.', bad:'is', correct:'were',
             why:'仮定法の If の文は過去形。be 動詞は were。' },
      change:{ task:'「もし〜だったら」の文に', from:'It is not sunny.',
               tmpl:'If it ___ sunny, we ___ play soccer.', answers:['were','would'],
               why:'is → were、うしろは would。' } },

    { en:'I wish I could see you every day.', ja:'毎日あなたに会えたらいいのに。', accept:[],
      choice:{ text:'I wish I (　) see you every day.', options:['could','can','will','do'], answer:0,
               why:'「会えたらいいのに」は could。' },
      find:{ wrong:'I wish I can see you every day.', bad:'can', correct:'could',
             why:'I wish のあとは過去形。can → could。' },
      change:{ task:'「〜できたらいいのに」という文に', from:"I can't see you every day.",
               tmpl:'I wish I ___ ___ you every day.', answers:['could','see'],
               why:"can't → could ＋ 原形 see。" } },

    { en:'If I lived in Tokyo, I would visit the museum often.', ja:'東京に住んでいたら、その博物館によく行くのに。', accept:[],
      choice:{ text:'If I (　) in Tokyo, I would visit the museum often.', options:['lived','live','living','lives'], answer:0,
               why:'If の文は過去形 lived。' },
      find:{ wrong:'If I live in Tokyo, I would visit the museum often.', bad:'live', correct:'lived',
             why:'仮定法の If の文は過去形。live → lived。' },
      change:{ task:'「もし〜だったら」の文に', from:"I don't live in Tokyo.",
               tmpl:'If I ___ in Tokyo, I ___ visit the museum often.', answers:['lived','would'],
               why:'live → lived、うしろは would。' } }
  ]
}

];
</script>
<script>
// 問題データ。読めていないときに画面が真っ白にならないよう、
// ここで止めずに空の配列にして、一覧に理由を出す。
const ITEMS = (typeof G3_GRAMMAR !== 'undefined') ? G3_GRAMMAR : [];
const GRADE = 3;

// ================================================================
//  モードの設定（ポイントはB案：1文あたり合計8点）
// ================================================================
const MODES = {
  choice: { key:'choice', icon:'✅', title:'形をえらぶ',     desc:'4つの中から正しい形を選ぶ',               badge:'CHOICE', pt:1 },
  sort:   { key:'sort',   icon:'🔀', title:'語順ならべかえ', desc:'単語をタップして正しい順に並べる',         badge:'SORT',   pt:1 },
  find:   { key:'find',   icon:'🔍', title:'まちがいさがし', desc:'まちがっている単語をタップする',           badge:'FIND',   pt:1 },
  change: { key:'change', icon:'🔁', title:'文をかえる',     desc:'言いかえたり、2つの文を1つにまとめる',     badge:'CHANGE', pt:2 },
  write:  { key:'write',  icon:'✍️', title:'日本語⇒英語',    desc:'日本語を見て英文を書く（いちばん難しい）', badge:'WRITE',  pt:3 }
};
const MODE_ORDER = ['choice', 'sort', 'find', 'change', 'write'];
const PT_PER_SENTENCE = MODE_ORDER.reduce((a, k) => a + MODES[k].pt, 0);   // 8点

let item = null;         // いま開いている文法項目
let SENTENCES = [];      // その項目の文

// ================================================================
//  記録
//
//  保存できない環境（プレビュー表示やシークレットウィンドウ）では
//  黙って失敗すると「やったのに未挑戦のまま」になって原因が分からない。
//  使えないときは画面に知らせ、その場かぎりの入れ物で動かす。
// ================================================================
let storageOK = (function () {
  try { localStorage.setItem('__test', '1'); localStorage.removeItem('__test'); return true; }
  catch (e) { return false; }
})();
const memoryStore = {};

function recKey(id) { return 'gram_' + id; }
function loadRecord(id) {
  if (!storageOK) return memoryStore[id] || {};
  try { return JSON.parse(localStorage.getItem(recKey(id))) || {}; }
  catch (e) { storageOK = false; return memoryStore[id] || {}; }
}
function saveRecord(id, rec) {
  memoryStore[id] = rec;
  if (!storageOK) return;
  try { localStorage.setItem(recKey(id), JSON.stringify(rec)); }
  catch (e) { storageOK = false; }
}

/** そのモードで一度でも正解した問題数（進み具合のバー用） */
function clearedCount(id, modeKey) {
  const r = loadRecord(id)[modeKey] || {};
  return Object.keys(r).filter(i => r[i]).length;
}
function clearedTotal(it) {
  return MODE_ORDER.reduce((s, k) => s + clearedCount(it.id, k), 0);
}
function clearedMax(it) { return it.sentences.length * MODE_ORDER.length; }

/**
 * 項目の累計ポイント。
 * 正解するたびに加算し、上限は設けない（同じ問題を解き直しても増える）。
 */
function itemPoints(it) {
  const p = loadRecord(it.id).pts || {};
  return MODE_ORDER.reduce((s, k) => s + (Number(p[k]) || 0), 0);
}
function addPoints(id, modeKey, n) {
  const rec = loadRecord(id);
  rec.pts = rec.pts || {};
  rec.pts[modeKey] = (Number(rec.pts[modeKey]) || 0) + n;
  saveRecord(id, rec);
  saveGrammarSummary();
}

/**
 * 学年ぜんぶの到達状況を要約して保存し、先生のところへ送る。
 * 先生用ダッシュボードはこの要約だけを読めばよい。
 */
function saveGrammarSummary() {
  const sum = { points: 0, cleared: 0, total: 0, items: ITEMS.length };
  ITEMS.forEach(it => {
    sum.points  += itemPoints(it);
    sum.cleared += clearedTotal(it);
    sum.total   += clearedMax(it);
  });
  try { localStorage.setItem('grammar_summary_g' + GRADE, JSON.stringify(sum)); } catch (e) {}
  if (window.ProgressSync) window.ProgressSync.sync(false);
}

/** 前にまちがえて、まだ正解できていない問題 */
function weakList(id, modeKey) {
  const w = (loadRecord(id).weak || {})[modeKey] || [];
  const n = (ITEMS.filter(x => x.id === id)[0] || { sentences: [] }).sentences.length;
  return w.filter(i => Number.isInteger(i) && i >= 0 && i < n);
}
function markWeak(id, modeKey, i, isWeak) {
  const rec = loadRecord(id);
  rec.weak = rec.weak || {};
  const list = (rec.weak[modeKey] || []).filter(x => x !== i);
  if (isWeak) list.push(i);
  rec.weak[modeKey] = list;
  saveRecord(id, rec);
}

// ================================================================
//  画面の切り替え
// ================================================================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (id === 'page-items') renderItems();
  if (id === 'page-menu')  renderMenu();
}

function renderItems() {
  document.getElementById('storage-warn').style.display = storageOK ? 'none' : 'block';
  document.getElementById('hd-title').textContent = '📘 文法学習';
  document.getElementById('hd-sub').textContent = '中学' + GRADE + '年';
  if (!ITEMS.length) {
    document.getElementById('item-list').innerHTML =
      '<div class="notice">⚠ <strong>問題データが読み込めませんでした。</strong><br>'
      + 'ファイルがこわれている可能性があります。先生に知らせてください。</div>';
    return;
  }
  document.getElementById('item-list').innerHTML = ITEMS.map((it, i) => {
    // バーは「何問クリアしたか」、数字は「ためたポイント」。
    // ポイントは解き直すたびに増えるので、上限での割合は出せない。
    const done = clearedTotal(it), max = clearedMax(it);
    return '<button class="item-card" onclick="openItem(' + i + ')">'
      + '<div class="ic-icon">' + it.icon + '</div>'
      + '<div class="ic-body">'
      +   '<div class="ic-title">' + it.title + '</div>'
      +   '<div class="ic-sub">' + it.sub + '</div>'
      +   '<div class="ic-bar-bg"><div class="ic-bar" style="width:' + (done / max * 100) + '%"></div></div>'
      + '</div>'
      + '<div class="ic-pt"><div class="ic-pt-num">' + itemPoints(it) + '点</div>'
      +   '<div class="ic-pt-sub">' + done + ' / ' + max + '問</div></div>'
      + '</button>';
  }).join('');
}

function openItem(i) {
  item = ITEMS[i];
  SENTENCES = item.sentences;
  document.getElementById('hd-title').textContent = item.icon + ' ' + item.title;
  document.getElementById('hd-sub').textContent = '文法学習 ／ 中学' + GRADE + '年';
  document.getElementById('explain-title').textContent = item.title;
  document.getElementById('explain-body').innerHTML = item.intro;
  document.getElementById('menu-title').textContent = item.title;
  // はじめての項目は説明から、2回目からは練習メニューから
  showPage(itemPoints(item) > 0 ? 'page-menu' : 'page-explain');
}

function renderMenu() {
  if (!item) { showPage('page-items'); return; }
  document.getElementById('menu-list').innerHTML = MODE_ORDER.map(k => {
    const m = MODES[k];
    const done = clearedCount(item.id, k), total = SENTENCES.length;
    const pct = Math.round(done / total * 100);
    let cls = '', label = '未挑戦';
    if (done > 0) {
      label = done + ' / ' + total + '問クリア';
      cls = pct === 100 ? 'perfect' : (pct >= 70 ? 'high' : (pct >= 40 ? 'mid' : 'low'));
    }
    const weak = weakList(item.id, k);
    const weakBtn = weak.length
      ? '<button class="mc-weak" onclick="event.stopPropagation(); startQuiz(\'' + k + '\', weakList(item.id, \'' + k + '\'))">'
        + '🔥 にがて ' + weak.length + '問だけ</button>'
      : '';
    return '<div class="menu-card" onclick="startQuiz(\'' + k + '\')">'
      + '<div class="mc-icon">' + m.icon + '</div>'
      + '<div class="mc-body">'
      +   '<div class="mc-title">' + m.title + '</div>'
      +   '<div class="mc-desc">' + m.desc + '</div>'
      +   '<span class="mc-achievement ' + cls + '">' + label + '</span>'
      +   weakBtn
      + '</div>'
      + '<div class="mc-pt">1問 ' + m.pt + '点</div>'
      + '</div>';
  }).join('');
  const done = clearedTotal(item), max = clearedMax(item);
  document.getElementById('menu-done').textContent = 'クリア ' + done + ' / ' + max + '問';
  document.getElementById('menu-pt').textContent = '🏅 ' + itemPoints(item) + ' 点';
  document.getElementById('menu-bar').style.width = (done / max * 100) + '%';
}

// ================================================================
//  問題の進行
// ================================================================
let mode = null, order = [], qIndex = 0, correctCount = 0, answered = false;
let sortPicked = [], wrongList = [];

function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

/**
 * 練習をはじめる。
 * @param {string} modeKey モード
 * @param {number[]} only  指定すると、その文だけを出す（にがて練習・まちがい直し）
 */
function startQuiz(modeKey, only) {
  mode = MODES[modeKey];
  order = shuffle(only && only.length ? only : SENTENCES.map((_, i) => i));
  qIndex = 0; correctCount = 0; wrongList = [];
  document.getElementById('quiz-title').textContent =
    mode.title + ((only && only.length) ? '（にがて）' : '');
  document.getElementById('quiz-badge').textContent = mode.badge;
  showPage('page-quiz');
  loadQuestion();
}

function loadQuestion() {
  answered = false; sortPicked = [];
  const s = SENTENCES[order[qIndex]];
  document.getElementById('quiz-count').textContent = '問題 ' + (qIndex + 1) + ' / ' + order.length;
  document.getElementById('quiz-score').textContent = '正解 ' + correctCount;
  document.getElementById('quiz-bar').style.width = (qIndex / order.length * 100) + '%';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('hint-box').className = 'hint-box';

  // 「形をえらぶ」「まちがいさがし」はタップした瞬間に判定するので
  // 「答え合わせ」ボタンは出さない。
  const tapOnly = (mode.key === 'choice' || mode.key === 'find');
  document.getElementById('btn-check').style.display = tapOnly ? 'none' : 'inline-block';
  document.getElementById('btn-check').disabled = false;
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('btn-reset').style.display = (mode.key === 'sort') ? 'inline-block' : 'none';
  document.getElementById('btn-hint').style.display = 'inline-block';

  const body = document.getElementById('quiz-body');
  if (mode.key === 'choice') body.innerHTML = viewChoice(s);
  if (mode.key === 'sort')   body.innerHTML = viewSort(s);
  if (mode.key === 'find')   body.innerHTML = viewFind(s);
  if (mode.key === 'change') body.innerHTML = viewChange(s);
  if (mode.key === 'write')  body.innerHTML = viewWrite(s);
  if (mode.key === 'sort')   renderSort();
}

/**
 * 英文を単語に分ける。
 *  how 省略   … 文末のピリオドは落とす（並べ替え・語数かぞえ用）
 *  how 'mark' … 文末のピリオドを最後の語にくっつける（まちがいさがし用）
 */
function splitWords(en, how) {
  const m = String(en).match(/^(.*?)([.?!])$/);
  const body = m ? m[1] : en;
  const mark = m ? m[2] : '';
  const words = body.trim().split(/\s+/);
  if (how === 'mark' && mark) words[words.length - 1] += mark;
  return words;
}

// ---------- ① 形をえらぶ ----------
function viewChoice(s) {
  return '<div class="q-card">'
    + '<div class="q-label">正しい形をえらぼう</div>'
    + '<div class="q-text">' + s.choice.text.replace('(　)', '<span class="q-blank">(　　)</span>') + '</div>'
    + '<div class="q-ja">' + s.ja + '</div></div>'
    + '<div class="choice-list" id="choice-list">'
    + s.choice.options.map((o, i) => '<button class="choice-btn" data-i="' + i + '" onclick="pickChoice(' + i + ')">' + o + '</button>').join('')
    + '</div>';
}
function pickChoice(i) {
  if (answered) return;
  const s = SENTENCES[order[qIndex]];
  const ok = (i === s.choice.answer);
  document.querySelectorAll('#choice-list .choice-btn').forEach((b, j) => {
    b.disabled = true;
    if (j === s.choice.answer) { b.className = 'choice-btn correct'; b.innerHTML += '<span class="choice-mark">⭕</span>'; }
    else if (j === i) { b.className = 'choice-btn wrong'; b.innerHTML += '<span class="choice-mark">❌</span>'; }
  });
  finishQuestion(ok, s.choice.options[s.choice.answer], s.choice.why);
}

// ---------- ② 語順ならべかえ ----------
let sortWords = [], sortShuffled = [];
function viewSort(s) {
  sortWords = splitWords(s.en);
  sortShuffled = shuffle(sortWords.map((w, i) => ({ w: w, i: i })));
  return '<div class="q-card">'
    + '<div class="q-label">日本語を英語に直してみよう</div>'
    + '<div class="q-text">' + s.ja + '</div></div>'
    + '<div class="sort-area-label">👆 タップして並べ替えよう</div>'
    + '<div class="answer-area" id="answer-area"></div>'
    + '<div class="sort-area-label">単語バンク</div>'
    + '<div class="word-bank" id="word-bank"></div>';
}
function renderSort() {
  document.getElementById('answer-area').innerHTML = sortPicked.map((p, pos) =>
    '<button class="word-chip in-answer" ' + (answered ? 'disabled' : '') + ' onclick="unpickWord(' + pos + ')">' + sortShuffled[p].w + '</button>').join('');
  document.getElementById('word-bank').innerHTML = sortShuffled.map((o, i) =>
    sortPicked.indexOf(i) >= 0 ? '' :
    '<button class="word-chip" ' + (answered ? 'disabled' : '') + ' onclick="pickWord(' + i + ')">' + o.w + '</button>').join('');
}
function pickWord(i)   { if (!answered) { sortPicked.push(i); renderSort(); } }
function unpickWord(p) { if (!answered) { sortPicked.splice(p, 1); renderSort(); } }
function resetAnswer() { sortPicked = []; renderSort(); }

// ---------- ③ まちがいさがし ----------
let findWords = [];
function viewFind(s) {
  findWords = splitWords(s.find.wrong, 'mark');
  return '<div class="q-card">'
    + '<div class="q-label">まちがいは1か所</div>'
    + '<div class="q-text">まちがっている単語をタップしよう。</div>'
    + '<div class="q-ja">' + s.ja + '</div></div>'
    + '<div class="find-sentence" id="find-bank">'
    + findWords.map((w, i) => '<button class="find-word" onclick="pickFind(' + i + ')">' + w + '</button>').join(' ')
    + '</div>';
}
/** 末尾のピリオドを無視して語をくらべる */
function sameWord(a, b) {
  return String(a).replace(/[.?!]+$/, '') === String(b).replace(/[.?!]+$/, '');
}
function pickFind(i) {
  if (answered) return;
  const s = SENTENCES[order[qIndex]];
  const ok = sameWord(findWords[i], s.find.bad);
  document.querySelectorAll('#find-bank .find-word').forEach((b, j) => {
    b.disabled = true;
    if (sameWord(findWords[j], s.find.bad)) b.className = 'find-word is-answer';
    else if (j === i) b.className = 'find-word is-bad';
  });
  finishQuestion(ok, s.en,
    '「' + s.find.bad + '」が まちがい。正しくは ' + s.find.correct + '。' + s.find.why);
}

// ---------- ④ 文をかえる ----------
function viewChange(s) {
  let n = 0;
  const line = s.change.tmpl.replace(/___/g, () =>
    '<input class="blank-input" id="blank' + (n++) + '" autocomplete="off" autocapitalize="off" spellcheck="false">');
  return '<div class="q-card">'
    + '<div class="q-label">' + s.change.task + '</div>'
    + '<div class="q-text">' + s.change.from.replace(/\n/g, '<br>') + '</div>'
    + '<div class="q-ja">' + s.ja + '</div></div>'
    + '<div class="tmpl-line">' + line + '</div>';
}

// ---------- ⑤ 日本語⇒英語 ----------
function viewWrite(s) {
  return '<div class="q-card">'
    + '<div class="q-label">英語で書いてみよう</div>'
    + '<div class="q-text">' + s.ja + '</div>'
    + '<div class="q-sub">単語は ' + splitWords(s.en).length + ' 語。ピリオドも忘れずに。</div></div>'
    + '<input class="ans-input" id="write-input" placeholder="英語で入力…" autocomplete="off" autocapitalize="off" spellcheck="false">';
}

// ================================================================
//  答え合わせ
// ================================================================
/** 大文字小文字・記号・空白のちがいは正解あつかいにする */
function norm(t) {
  return String(t || '').toLowerCase().replace(/[.,!?]/g, '').replace(/\s+/g, ' ').trim();
}

function checkAnswer() {
  if (answered) return;
  const s = SENTENCES[order[qIndex]];
  let ok = false, correctText = '', why = '';

  if (mode.key === 'sort') {
    if (!sortPicked.length) return;
    const made = sortPicked.map(p => sortShuffled[p].w).join(' ');
    ok = norm(made) === norm(sortWords.join(' '));
    correctText = s.en;

  } else if (mode.key === 'change') {
    const got = s.change.answers.map((_, i) => document.getElementById('blank' + i).value);
    if (got.some(v => !v.trim())) return;
    ok = got.every((v, i) => norm(v) === norm(s.change.answers[i]));
    let k = 0;
    correctText = s.change.tmpl.replace(/___/g, () => s.change.answers[k++]);
    why = s.change.why;
    s.change.answers.forEach((a, i) => {
      const el = document.getElementById('blank' + i);
      el.disabled = true;
      const good = norm(el.value) === norm(a);
      el.style.color = good ? '#1a7a45' : '#c0392b';
      el.style.borderBottomColor = good ? '#43e97b' : '#ff416c';
    });

  } else if (mode.key === 'write') {
    const got = document.getElementById('write-input').value;
    if (!got.trim()) return;
    ok = [s.en].concat(s.accept || []).some(a => norm(a) === norm(got));
    correctText = s.en;
    why = (s.accept && s.accept.length) ? 'ほかに「' + s.accept.join('」「') + '」も正解。' : '';
    const el = document.getElementById('write-input');
    el.disabled = true;
    el.style.borderColor = ok ? '#43e97b' : '#ff416c';
  }

  finishQuestion(ok, correctText, why);
}

/** 正解・不正解が決まったあとの共通処理（記録・表示・ボタン） */
function finishQuestion(ok, correctText, why) {
  answered = true;
  if (mode.key === 'sort') renderSort();

  if (ok) {
    correctCount++;
    const rec = loadRecord(item.id);
    rec[mode.key] = rec[mode.key] || {};
    rec[mode.key][order[qIndex]] = true;   // 進み具合（何問クリアしたか）
    saveRecord(item.id, rec);
    addPoints(item.id, mode.key, mode.pt); // ポイントは正解するたびに加算（上限なし）
    markWeak(item.id, mode.key, order[qIndex], false);   // にがてを卒業
  } else {
    if (wrongList.indexOf(order[qIndex]) < 0) wrongList.push(order[qIndex]);
    markWeak(item.id, mode.key, order[qIndex], true);
  }

  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (ok ? 'correct' : 'wrong');
  fb.innerHTML = (ok ? '⭕ 正解！ <b>+' + mode.pt + '点</b>' : '❌ おしい！')
    + (ok && !why ? '' : '<span class="fb-ans">' + correctText + '</span>')
    + (why ? '<span class="fb-why">' + why + '</span>' : '');

  document.getElementById('quiz-score').textContent = '正解 ' + correctCount;
  document.getElementById('btn-check').style.display = 'none';
  document.getElementById('btn-reset').style.display = 'none';
  document.getElementById('btn-hint').style.display = 'none';
  document.getElementById('btn-next').style.display = 'inline-block';
  document.getElementById('btn-next').textContent = (qIndex + 1 >= order.length) ? '結果を見る →' : '次へ →';
}

function toggleHint() {
  const box = document.getElementById('hint-box');
  const s = SENTENCES[order[qIndex]];
  let text = '';
  if (mode.key === 'choice') text = '日本語の意味と、空所の前後のことばをよく見てみよう。';
  if (mode.key === 'sort')   text = '最初の単語は <b>' + splitWords(s.en)[0] + '</b>';
  if (mode.key === 'find')   text = 'まちがいは1か所だけ。動詞の形と、使っている語が合っているかを見てみよう。';
  if (mode.key === 'change') text = '最初のあなに入る語は <b>' + s.change.answers[0] + '</b>';
  if (mode.key === 'write')  text = '書き出しは <b>' + splitWords(s.en).slice(0, 2).join(' ') + ' …</b>';
  box.innerHTML = '💡 ' + text;
  box.classList.toggle('visible');
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= order.length) { showResult(); return; }
  loadQuestion();
}

function showResult() {
  const pct = Math.round(correctCount / order.length * 100);
  document.getElementById('result-icon').textContent = pct === 100 ? '🏆' : (pct >= 70 ? '🎉' : '💪');
  document.getElementById('result-main').textContent =
    pct === 100 ? 'ぜんぶ正解！' : (pct >= 70 ? 'よくできました！' : 'もう一度ちょうせん！');
  document.getElementById('result-score').textContent =
    mode.title + '　' + correctCount + ' / ' + order.length + '問 正解（' + pct + '%）';
  document.getElementById('result-pt').textContent = '+' + (correctCount * mode.pt) + ' 点';

  const btn = document.getElementById('btn-retry-wrong');
  if (wrongList.length) {
    btn.style.display = 'block';
    btn.textContent = '❌ まちがえた ' + wrongList.length + '問だけやり直す';
  } else {
    btn.style.display = 'none';
  }
  showPage('page-result');
}

function retryQuiz()  { startQuiz(mode.key); }
function retryWrong() { startQuiz(mode.key, wrongList.slice()); }

function confirmBack() {
  if (qIndex > 0 && !confirm('とちゅうです。メニューにもどりますか？')) return;
  showPage('page-menu');
}

// Enterキーで答え合わせ（タップで判定するモードは対象外）
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  if (!document.getElementById('page-quiz').classList.contains('active')) return;
  e.preventDefault();
  if (answered) nextQuestion();
  else if (mode && mode.key !== 'choice' && mode.key !== 'find') checkAnswer();
});

renderItems();
saveGrammarSummary();   // 開いた時点の状態も先生に送る（登録済みのときだけ送られる）
</script>
</body>
</html>

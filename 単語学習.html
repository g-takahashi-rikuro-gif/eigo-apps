<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単語学習</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px 16px 40px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .app {
    background: #fff;
    border-radius: 24px;
    width: 100%;
    max-width: 680px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.35);
    overflow: hidden;
  }

  .app-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .app-header .hd-title { font-size: 1.05em; font-weight: 800; letter-spacing: 0.3px; }
  .app-header .hd-sub { font-size: 0.8em; opacity: 0.85; margin-top: 2px; }
  .hd-home-link {
    color: #fff; text-decoration: none; font-size: 0.75em; font-weight: 700;
    background: rgba(255,255,255,0.18); border-radius: 50px; padding: 6px 14px;
    white-space: nowrap; flex-shrink: 0; transition: background 0.15s;
  }
  .hd-home-link:hover { background: rgba(255,255,255,0.32); }

  .page { padding: 24px; text-align: center; }
  .title-icon { font-size: 4.5em; margin-bottom: 10px; }
  .title-main { font-size: 1.6em; font-weight: 900; color: #5B6CF5; margin-bottom: 6px; }
  .title-sub  { font-size: 0.92em; color: #888; margin-bottom: 28px; }

  .menu-list { display: flex; flex-direction: column; gap: 14px; text-align: left; }

  .menu-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: #f8f9ff;
    border: 2px solid #e2e5f5;
    border-radius: 18px;
    padding: 18px 20px;
    text-decoration: none;
    transition: all 0.15s;
  }
  .menu-card:hover { border-color: #5B6CF5; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(91,108,245,0.15); }
  .menu-card .mc-icon {
    font-size: 2.2em; flex-shrink: 0; width: 64px; height: 64px;
    background: #fff; border-radius: 16px; display: flex; align-items: center; justify-content: center;
  }
  .menu-card .mc-body { flex: 1; }
  .menu-card .mc-title { font-size: 1.05em; font-weight: 800; color: #333; margin-bottom: 4px; }
  .menu-card .mc-desc { font-size: 0.82em; color: #888; line-height: 1.5; }
  .menu-card .mc-tag {
    display: inline-block; font-size: 0.7em; font-weight: 700; color: #5B6CF5;
    background: #eef0ff; border-radius: 50px; padding: 2px 10px; margin-top: 6px;
  }
  .menu-card .mc-arrow { font-size: 1.3em; color: #5B6CF5; flex-shrink: 0; }

  .menu-card.disabled {
    opacity: 0.55; cursor: default; pointer-events: none;
  }
  .menu-card.disabled .mc-tag { background: #f0f0f0; color: #999; }

  .footer-note { margin-top: 26px; font-size: 0.78em; color: #aaa; line-height: 1.6; }
</style>
</head>
<body>

<div class="app">
  <div class="app-header">
    <div>
      <div class="hd-title">単語学習</div>
      <div class="hd-sub">学年を選んでください</div>
    </div>
    <a class="hd-home-link" href="英語学習アプリ.html">🏠 トップ</a>
  </div>

  <div class="page">
    <div class="title-icon">📚</div>
    <div class="title-main">単語学習</div>
    <div class="title-sub">練習したい学年を選んでスタートしよう</div>

    <div class="menu-list">
      <div class="menu-card disabled">
        <div class="mc-icon">🔒</div>
        <div class="mc-body">
          <div class="mc-title">1年生</div>
          <div class="mc-desc">準備中です。今後追加予定です。</div>
          <span class="mc-tag">準備中</span>
        </div>
      </div>

      <div class="menu-card disabled">
        <div class="mc-icon">🔒</div>
        <div class="mc-body">
          <div class="mc-title">2年生</div>
          <div class="mc-desc">準備中です。今後追加予定です。</div>
          <span class="mc-tag">準備中</span>
        </div>
      </div>

      <a class="menu-card" href="vocabulary-trainer.html">
        <div class="mc-icon">📚</div>
        <div class="mc-body">
          <div class="mc-title">3年生</div>
          <div class="mc-desc">英単語の暗記・確認テスト。ゲーム感覚で練習できる。</div>
          <span class="mc-tag">対応済み</span>
        </div>
        <div class="mc-arrow">›</div>
      </a>
    </div>

    <div class="footer-note">「🏠 トップ」から、英語学習アプリのメニューに戻れます。</div>
  </div>
</div>

<script src="進捗同期.js"></script>

</body>
</html>
